# SSH Server Custom Configuration for Raspberry Pi
# This file is automatically included by /etc/ssh/sshd_config via Include directive

# 詳細なログを取得する
LogLevel VERBOSE

# 空のパスワードを使用するユーザーをブロックする
PermitEmptyPasswords no

# root によるログインを禁止する
PermitRootLogin no

# パスワード認証によるログインを禁止する
PasswordAuthentication no

# チャレンジ / レスポンス認証を無効にする
ChallengeResponseAuthentication no

# キーボードインターフェースによる認証を無効にする
KbdInteractiveAuthentication no

# GSSAPI(Generic Security Service API)ベースのユーザ認証を無効にする
GSSAPIAuthentication no

# Kerberos 認証を無効にする
KerberosAuthentication no

# SSH 鍵認証を使用する
PubkeyAuthentication yes

# 暗号強度の強い鍵に制限する
HostKey /etc/ssh/ssh_host_ed25519_key

# ポートフォワーディングを禁止する
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
